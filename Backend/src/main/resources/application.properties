spring.application.name=bolsines-backend
# Variables de entorno: Backend/.env (copiar de .env.example). Las variables del sistema operativo tienen prioridad.
# La segunda ruta cubre el caso de ejecutar desde la raíz del repositorio (ej: IntelliJ abierto en la raíz).
spring.config.import=optional:file:.env[.properties],optional:file:./Backend/.env[.properties]

server.port=${SERVER_PORT:8081}

# Base de datos: si no existe la crea CreadorBaseDatos al iniciar; las tablas las crea Hibernate
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bolsines}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# GPS Tracker (API mock de la catedra: https://github.com/LiberaeMentis/dsi-api-bolsines)
gps.base-url=${GPS_BASE_URL:http://localhost:8080}
gps.dispositivo-por-defecto=${GPS_DISPOSITIVO_POR_DEFECTO:XTR-4500L}
gps.api-keys={'XTR-4500L':'${GPS_API_KEY_XTR}','NavTrack QX-7A':'${GPS_API_KEY_NAVTRACK}','GeoPulse MTR-900':'${GPS_API_KEY_GEOPULSE}'}

# Frontend React
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
