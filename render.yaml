# Blueprint de Render: PostgreSQL + Bolsines (backend con el frontend adentro) + mock del GPS Tracker.
# Render > New > Blueprint > elegir este repositorio. Los valores con "sync: false" los pide al crear.
databases:
  - name: bolsines-db
    databaseName: bolsines
    user: bolsines
    plan: free

services:
  - type: web
    name: bolsines
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/comisiones-medicas
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: DB_HOST
        fromDatabase: { name: bolsines-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: bolsines-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: bolsines-db, property: database }
      - key: DB_USER
        fromDatabase: { name: bolsines-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: bolsines-db, property: password }
      - key: GPS_BASE_URL # URL pública del servicio bolsines-gps, ej: https://bolsines-gps.onrender.com
        sync: false
      - key: GPS_API_KEY_XTR # las mismas API keys que GpsMock/src/main/resources/application.properties
        sync: false
      - key: GPS_API_KEY_NAVTRACK
        sync: false
      - key: GPS_API_KEY_GEOPULSE
        sync: false

  - type: web
    name: bolsines-gps
    runtime: docker
    plan: free
    rootDir: GpsMock # rutas relativas a GpsMock; solo redespliega si cambia esa carpeta
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/mock/bolsines
    envVars:
      - key: SERVER_PORT
        value: "10000"
